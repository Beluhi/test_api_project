info:
  name: Update user name
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "name": "Petr"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
