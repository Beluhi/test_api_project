info:
  name: Create user
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/users"
  body:
    type: json
    data: |-
      {
        "name": "Ivan",
        "surname": "Ivanov",
        "phone": "+79000000001",
        "age": 25
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
