info:
  name: Create duplicate phone
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/users"
  body:
    type: json
    data: |-
      {
        "name": "Petr",
        "surname": "Petrov",
        "phone": "+79000000001",
        "age": 30
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
